name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install runtime and installation-test dependencies
        run: sudo apt-get update && sudo apt-get install -y libusb-1.0-0 make
      - name: Run unit tests
        run: python -m unittest discover -s tests -t .
      - name: Compile Python sources
        run: python -m compileall -q wavexlr tests

  installed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK and package smoke dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 adwaita-icon-theme libusb-1.0-0 xvfb xauth dbus-x11 desktop-file-utils
      - name: Stage complete package
        run: make install DESTDIR="$RUNNER_TEMP/openwave-stage" PREFIX=/usr PYTHON=/usr/bin/python3
      - name: Exercise installed entry points and GTK imports
        run: PYTHON=/usr/bin/python3 dbus-run-session -- xvfb-run -a sh packaging/smoke-install.sh "$RUNNER_TEMP/openwave-stage/usr"
      - name: Validate desktop entry
        run: desktop-file-validate "$RUNNER_TEMP/openwave-stage/usr/share/applications/openwave.desktop"
