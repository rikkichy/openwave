[workspace]
resolver = "3"
members = ["crates/openwave-core", "crates/openwave-runtime", "crates/openwave-desktop"]

[workspace.package]
version = "1.1.1"
edition = "2024"
rust-version = "1.92"
publish = false
license = "MIT"
repository = "https://github.com/rikkichy/openwave"

[workspace.dependencies]
openwave-core = { path = "crates/openwave-core" }
openwave-runtime = { path = "crates/openwave-runtime" }
gtk = { package = "gtk4", version = "=0.11.4", features = ["v4_14"] }
adw = { package = "libadwaita", version = "=0.9.2", features = ["v1_5"] }
glib = "=0.22.9"
gio = "=0.22.9"
rusb = "=0.9.4"
serde = { version = "=1.0.229", features = ["derive", "rc"] }
serde_json = { version = "=1.0.151", features = ["preserve_order"] }
indexmap = { version = "=2.14.2", features = ["serde"] }
caseless = "=0.2.2"
clap = { version = "=4.6.6", features = ["derive"] }
async-channel = "=2.5.0"
thiserror = "=2.0.20"
uuid = { version = "=1.26.0", features = ["v4"] }
sha2 = "=0.11.0"
rustix = { version = "=1.1.4", features = ["fs", "process", "event", "thread"] }
tempfile = "=3.27.0"
log = "=0.4.34"
env_logger = "=0.11.11"
signal-hook = "=0.4.4"
toml = "=1.1.5"
